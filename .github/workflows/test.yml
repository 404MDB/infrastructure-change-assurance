name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reporter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run reporter tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
